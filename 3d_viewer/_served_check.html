function animate() {
    requestAnimationFrame(animate);
    
    const elapsed = clock.getElapsedTime();
    const t = (state.debugTime !== null && state.debugTime !== undefined) ? state.debugTime : elapsed;
    _mmdUpdate(0.016);
    if (!_playingVmd) { _updateBoneAction(t); }   // æ­æ¾å¤é¨vmdæ¶ä¸é©±å¨ä»£ç éª¨éª¼å¨ä½(é¿åææ¶)
    
    if (mesh) {
        // å¼å¸æµ®å¨ï¼éå°å ä¹ä¸å¯å¯ï¼é¿å"æ´ä¸ªäººä¸ä¸æ"çä½æèå¨ä½ï¼
        mesh.position.y = Math.sin(t * 1.2) * 0.012;
        
        // å¼å¸ç¼©æ¾ï¼å¾®å¾®èµ·ä¼ï¼
        const breathScale = 1.0 + Math.sin(t * 2.0) * 0.004;
        mesh.scale.set(breathScale, breathScale, breathScale);
        
        // ââ ç¨ç¼ï¼èªç¶èå¥ï¼å¿«éé­âç­ä¿æâç¼æ¢å¼ï¼ ââ
        state.blinkTimer += 0.016;
        let blinkVal = 0;
        if (state.blinkTimer > state.nextBlink) {
            const phase = state.blinkTimer - state.nextBlink;
            if (phase < 0.04) {
                blinkVal = phase / 0.04;               // 0.04s é­ç¼
            } else if (phase < 0.12) {
                blinkVal = 1.0;                         // 0.08s ä¿æé­å
            } else if (phase < 0.24) {
                blinkVal = 1.0 - (phase - 0.12) / 0.12; // 0.12s ç¼æ¢çå¼
            } else {
                state.blinkTimer = 0;
                state.nextBlink = 2.5 + Math.random() * 3.5;
            }
        }
        setMorphList(morphMap.blink, blinkVal);
        
        // ââ å´å·´ï¼è¯´è¯æ¶éæºåé³å£å+å¹³æ»ï¼ä¸è¯´è¯å®å¨é­å´ ââ
        if (state.speaking) {
            if (!state._nextMouthChange || t > state._nextMouthChange) {
                state.mouthVowel = Math.floor(Math.random() * 5);   // éæºåé³ ã/ã/ã/ã/ã
                state.mouthTarget = 0.3 + Math.random() * 0.5;
                state._nextMouthChange = t + 0.08 + Math.random() * 0.05;
            }
        } else {
            state.mouthTarget = 0;
        }
        state.mouthOpen = state.mouthOpen * 0.6 + state.mouthTarget * 0.4;
        if (morphMap.mouth && morphMap.mouth.length > 0) {
            const vowels = ['ã','ã','ã','ã','ã'];
            let vowelIdx = 0;
            for (const m of morphMap.mouth) {
                if (vowels.includes(m.name)) {
                    mesh.morphTargetInfluences[m.idx] = (vowelIdx === state.mouthVowel) ? state.mouthOpen : 0;
                    vowelIdx++;
                } else {
                    mesh.morphTargetInfluences[m.idx] = 0;
                }
            }
        }
        
        // ââ å¾æºå¨ä½ï¼æèåºå®èªç¶ä¸åï¼ARM_DOWN_Z æ ¡æ­£ï¼å·²éªè¯æåï¼ ââ
        // 2026-08-17 å¤ªä¹æä»¤ï¼å»ææè/äº¤åå¨ç»ï¼è³èæ­£å¸¸ä¸åå³å¯ï¼ä¹åå¨ææå¨æè³èè½¬å°èº«åçä¸å°ï¼
        const ab = state.armBones;
        if (ab && !state.armLock && !_playingVmd) {   // æ­å¤é¨vmdæ¶ä¸è¦çæè(é¿åä¸å¨ä½ææ¶)
            // ä¸èï¼åºå®ä¸ååºåï¼æ æå¨ãæ äº¤åï¼
            const lUpperZ = ab.lUpper_init.z + ARM_DOWN_Z;
            const rUpperZ = ab.rUpper_init.z - ARM_DOWN_Z;
            // èé¨ï¼åºå®èªç¶å¾®å¼¯ï¼æ æå¨ï¼
            const lElbowZ = ab.lElbow_init.z + ELBOW_DOWN_Z;
            const rElbowZ = ab.rElbow_init.z - ELBOW_DOWN_Z;
            if (ab.lUpper) {
                ab.lUpper.rotation.set(ab.lUpper_init.x, ab.lUpper_init.y, lUpperZ);
                ab.lUpper.updateMatrixWorld(true);
            }
            if (ab.rUpper) {
                ab.rUpper.rotation.set(ab.rUpper_init.x, ab.rUpper_init.y, rUpperZ);
                ab.rUpper.updateMatrixWorld(true);
            }
            if (ab.lElbow) {
                ab.lElbow.rotation.set(ab.lElbow_init.x, ab.lElbow_init.y, lElbowZ);
                ab.lElbow.updateMatrixWorld(true);
            }
            if (ab.rElbow) {
                ab.rElbow.rotation.set(ab.rElbow_init.x, ab.rElbow_init.y, rElbowZ);
                ab.rElbow.updateMatrixWorld(true);
            }
            // æèï¼ä¿æåå§å§¿æï¼ä¸å¨ï¼
            if (ab.lHand) {
                ab.lHand.rotation.set(ab.lHand_init.x, ab.lHand_init.y, ab.lHand_init.z);
                ab.lHand.updateMatrixWorld(true);
            }
            if (ab.rHand) {
                ab.rHand.rotation.set(ab.rHand_init.x, ab.rHand_init.y, ab.rHand_init.z);
                ab.rHand.updateMatrixWorld(true);
            }
        }
        
        // ââ è¡¨æ ââ
        switch (state.emotion) {
            case 'happy':
                state.smileAmount += (0.5 - state.smileAmount) * 0.05;
                if (_activeBoneAction === null) { _activeBoneAction = 'idle'; }
                break;
            case 'sad':
                state.smileAmount += (-0.1 - state.smileAmount) * 0.05;
                break;
            case 'surprise':
                state.smileAmount += (0.1 - state.smileAmount) * 0.05;
                if (_activeBoneAction === null) { _activeBoneAction = 'nod'; }
                break;
            case 'angry':
                state.smileAmount += (0.02 - state.smileAmount) * 0.05;
                if (_activeBoneAction === null) { _activeBoneAction = 'shake'; }
                break;
            default:
                state.smileAmount += (0.15 - state.smileAmount) * 0.05;
        }
        setMorphList(morphMap.smile, Math.max(0, state.smileAmount));
        if (state.emotion === 'sad') {
            setMorphList(morphMap.sad, 0.3 + 0.1 * Math.sin(t * 2));
        } else {
            setMorphList(morphMap.sad, 0);
        }
        // æ¹æ¡C: æç»ªè¡¨æå å  (surprise/angry morph)
        if (state.emotion === 'surprise') {
            setMorphList(morphMap.surprise, 0.35 + 0.1 * Math.sin(t * 3));
        } else {
            setMorphList(morphMap.surprise, 0);
        }
        if (state.emotion === 'angry') {
            setMorphList(morphMap.angry, 0.4);
        } else {
            setMorphList(morphMap.angry, 0);
        }
    }
    
    // ââ å°é¢åæå¼å¸ ââ
    glowCircle.material.opacity = 0.04 + 0.03 * Math.sin(t * 1.2);
    
    // ââ ç§æèæ¯èå¨ï¼æ¼©æ¶¡æ¼ç§» + ç¯æå°æµæè½¬å¸å¥ + å¸ç§¯ç¯æè½¬å¼å¸ + èç¯å¼å¸ ââ
    skyMat.uniforms.uT.value = t;
    starMat.opacity = 0.55 + 0.3 * Math.sin(t * 0.9);

    // å¤§åçä¸çè¡æç²å­ï¼ç»çæè½¬ + åèªéæºéªç(æ¶å¤±åäº®)ï¼éè½ä¸ä¸çé»
    const sPos = stars.geometry.attributes.position.array;
    const sSz  = stars.geometry.attributes.size.array;   // æ¯é¢ç²å­sizeå±æ§
    const sT = Math.sin(DISK_TILT), cT = Math.cos(DISK_TILT);
    for (let i = 0; i < starCount; i++) {
        // ç»çæè½¬ï¼è¿å¿ç¥å¿«ï¼ç¼ç¼ä¸åæ­¥ï¼æå±æ¬¡æï¼
        const rr  = starOrbit[i];
        const angSpeed = 1.1 / (rr + 6);
        starAng[i] += angSpeed * 0.016;
        const curR = rr;
        // çé¢å±é¨åæ ï¼åºå®è½¨éï¼ä¸æ¶ç¼©ââå¤§åçä¸éè¦å¸å¥ï¼
        const lx = Math.cos(starAng[i]) * curR;
        const ly = Math.sin(t * 0.5 + i) * 0.5;   // çé¢è½»å¾®èµ·ä¼
        const lz = Math.sin(starAng[i]) * curR;
        // ç»Xè½´å¾æ â ç«ä½çé¢
        sPos[i*3]   = BLACK_HOLE.x + lx;
        sPos[i*3+1] = BLACK_HOLE.y + ly * cT - lz * sT;
        sPos[i*3+2] = BLACK_HOLE.z + ly * sT + lz * cT;
        // ç¬ç«éæºéªçï¼æ¯é¢ç²å­ç¨èªå·±éæºçé¢ç/ç¸ä½ï¼(äº®-æ)éæºéè½ï¼ä¸æ¯ç»ä¸å¼å¸
        const ph = t * starFreq[i] + starPhase[i];
        const cyc = ph - Math.floor(ph);          // ä¸è§/é¯é½¿å¾ªç¯ 0~1ï¼ç­ä»·fract
        // æ¯ä¸ªç²å­éæºâäº®ä¸æ®µæ¶é´ / æä¸æ®µæ¶é´âçå¼å³åæ¢ï¼äº®æ®µå æ¯éç²å­èä¸åï¼
        const duty = 0.25 + (starPhase[i] % 0.55);   // äº®æå æ¯éç²å­ä¸å
        // smoothstep è½¯åå¼å³æ²¿ï¼ç¨æ­£å¼¦æ¿ä»£ï¼é¿åç¡¬åè¾¹ï¼
        const edgeLo = 0.5 + 0.5 * Math.sin((cyc - (duty - 0.15)) * 40.0);
        const edgeHi = 0.5 + 0.5 * Math.cos((cyc - duty) * 40.0);
        const on = Math.min(1, Math.max(0, edgeLo * (1.0 - edgeHi)));
        // äº®æ®µè¿æè½»å¾®å¼ºå¼±èµ·ä¼ï¼é¿ååæ¿
        const fadeIn = 0.55 + 0.45 * Math.sin(cyc * 6.283 + starPhase[i]);
        const amp = on * (0.5 + 0.5 * fadeIn);
        sSz[i] = 0.25 + 1.15 * amp;   // ææ¶æå°æ¥è¿æ¶å¤±ï¼äº®æ¶æ¾å¤§ââéæºäº®-ç­-åäº®
    }
    stars.geometry.attributes.position.needsUpdate = true;
    stars.geometry.attributes.size.needsUpdate = true;

    // å¸ç§¯ç¯ï¼æ´ä½æè½¬ + äº®åº¦å¼å¸
    accretionGold.rotation.z   = t * 0.12;
    accretionPurple.rotation.z = -t * 0.08;
    accretionBlue.rotation.z   = t * 0.05;
    const ringPulse = 0.5 + 0.5 * Math.sin(t * 0.8);
    accretionGold.material.opacity   = 0.22 + 0.16 * ringPulse;
    accretionPurple.material.opacity = 0.14 + 0.10 * ringPulse;
    accretionBlue.material.opacity   = 0.09 + 0.06 * ringPulse;
    // å¸ç§¯ç¯ç¼æ¢æ´ä½å¤æ©åæ¶å(å¼å¸æ¨æ)
    accretionGold.scale.setScalar(1.0 + 0.05 * ringPulse);
    accretionPurple.scale.setScalar(1.0 + 0.05 * ringPulse);
    accretionBlue.scale.setScalar(1.0 + 0.04 * ringPulse);

    footRing.material.opacity = 0.35 + 0.25 * Math.sin(t * 1.3);
    footRing.scale.setScalar(1 + 0.04 * Math.sin(t * 2.0));
    
    // ââ è±ç£ ââ
    if (state.speaking && petals.material.opacity < 0.5) {
        petals.material.opacity += 0.02;
    } else if (!state.speaking && petals.material.opacity > 0) {
        petals.material.opacity -= 0.01;
    }
    const pos = petals.geometry.attributes.position.array;
    for (let i = 0; i < petalCount; i++) {
        pos[i * 3] += velocities[i].vx * 0.2;
        pos[i * 3 + 1] += velocities[i].vy * 0.2;
        pos[i * 3 + 2] += velocities[i].vz * 0.2;
        if (pos[i * 3 + 1] > 35) {
            pos[i * 3] = (Math.random() - 0.5) * 30;
            pos[i * 3 + 1] = -5;
            pos[i * 3 + 2] = (Math.random() - 0.5) * 20 - 5;
        }
    }
    petals.geometry.attributes.position.needsUpdate = true;
    
    controls.update();
    renderer.render(scene, camera);
}

// âââââââââââââââââââââââââââââââââââââââââââââââ
//  Python â JS éä¿¡æ¥å£
//  ç± QWebEngineView.page().runJavaScript() è°ç¨
// âââââââââââââââââââââââââââââââââââââââââââââââ
window.__xuanji3d = {
    setSpeaking: function(speaking) {
        state.speaking = speaking;
    },
    setEmotion: function(emotion) {
        state.emotion = emotion;
    },
    setMorph: function(name, value) {
        setMorph(name, value);
    },
    playAction: function(name, vmdPath) {
        return playAction(name, vmdPath);
    },
    stopAction: function() {
        return stopAction();
    },
    setViewMode: function(mode) {
        // 'full' å¨èº« / 'bust' è¸é¨ä»¥ä¸ï¼ä¸ Python ä¾§æ¾ç¤ºæ¨¡å¼æé®èå¨ï¼
        state.viewMode = (mode === 'bust') ? 'bust' : 'full';
        fitCamera(state.viewMode);
    },
    resetCamera: function() {
        fitCamera(state.viewMode || 'full');
    },
    setCameraPos: function(x, y, z) {
        // è°è¯ç¨ï¼ç´æ¥è®¾ç½®ç¸æºä½ç½®ï¼ä¾§é¢è§è§éªè¯éª¨éª¼è½´åï¼
        camera.position.set(Number(x), Number(y), Number(z));
        controls.update();
        return 'cam=' + x + ',' + y + ',' + z;
    },
    getCamera: function() {
        // è°è¯ç¨ï¼è¿åå½åç¸æºä½ç½®/ç¦ç¹
        return JSON.stringify({
            px: +camera.position.x.toFixed(1), py: +camera.position.y.toFixed(1), pz: +camera.position.z.toFixed(1),
            tx: +controls.target.x.toFixed(1), ty: +controls.target.y.toFixed(1), tz: +controls.target.z.toFixed(1),
            mode: state.viewMode
        });
    },
    getMorphs: function() {
        // è°è¯ç¨ï¼è¿å morph æ å°é®ï¼ç¡®è®¤ç¨ç¼/å´å/è¡¨ææ¯å¦å¹éå°æ¨¡åï¼
        return JSON.stringify(Object.keys(morphMap));
    },
    getBones: function() {
        // è°è¯ç¨ï¼è¿åéª¨éª¼ååè¡¨ï¼å«æè/è©/èç­å³é®è¯çï¼
        if (!mesh || !mesh.skeleton) return 'no-skeleton';
        const names = mesh.skeleton.bones.map(function(b){ return b.name; });
        const kw = names.filter(function(n){ return /arm|Arm|è©|è|ã²ã|è|hand|Hand|æ/.test(n); });
        return JSON.stringify({total: names.length, arm: kw});
    },
    getArmState: function() {
        // è°è¯ç¨ï¼è¿åæèéª¨éª¼å½å rotationï¼ç¡®è®¤æèæ¯å¦çæ­£é©±å¨ï¼
        try {
            if (!state.armBones) return 'no-arm';
            const out = {};
            for (const k in state.armBones) {
                if (k.indexOf('_init') >= 0) continue;   // è·³è¿åå§å¼è®°å½é®
                const b = state.armBones[k];
                if (b) out[k] = { x: +b.rotation.x.toFixed(3), y: +b.rotation.y.toFixed(3), z: +b.rotation.z.toFixed(3) };
            }
            return JSON.stringify(out);
        } catch (e) {
            return 'ERR:' + e.message;
        }
    },
    setArmLock: function(lock) {
        // è°è¯ç¨ï¼éå®æèå¨ç»ï¼éªè¯èæ¬ç¨ï¼é¿åå¨ç»å¾ªç¯è¦çæå¨è®¾ç½®ï¼
        state.armLock = !!lock;
        return 'armLock=' + state.armLock;
    },
    setAnimTime: function(sec) {
        // è°è¯ç¨ï¼åºå®å¨ç»æ¶é´ç¹ï¼æªå¾éªè¯å¨ä½å§¿æï¼
        state.debugTime = (sec === null || sec === undefined) ? null : Number(sec);
        return 'animTime=' + state.debugTime;
    },
    forceArmZ: function(rad) {
        // è°è¯ç¨ï¼å¼ºå¶æä¸èç» Z è½´æè½¬ rad å¼§åº¦ï¼éªè¯éª¨éª¼æ¯å¦çæ­£é©±å¨ç½æ ¼ï¼
        try {
            const ab = state.armBones;
            if (!ab || !ab.lUpper) return 'no-arm';
            const radVal = rad || 0;
            ab.lUpper.rotation.z = (ab.lUpper_init ? ab.lUpper_init.z : 0) + radVal;
            ab.rUpper.rotation.z = (ab.rUpper_init ? ab.rUpper_init.z : 0) - radVal;
            ab.lUpper.updateMatrixWorld(true);
            ab.rUpper.updateMatrixWorld(true);
            return 'ok z=' + radVal.toFixed(3);
        } catch (e) {
            return 'ERR:' + e.message;
        }
    },
    forceArmAxis: function(axis, val) {
        // è°è¯ç¨ï¼ç»æå®è½´æè½¬ä¸èï¼axis: x/y/zï¼ï¼å·¦å³éå
        try {
            const ab = state.armBones;
            if (!ab || !ab.lUpper) return 'no-arm';
            const v = Number(val) || 0;
            if (axis === 'x') {
                ab.lUpper.rotation.x = (ab.lUpper_init ? ab.lUpper_init.x : 0) + v;
                ab.rUpper.rotation.x = (ab.rUpper_init ? ab.rUpper_init.x : 0) + v;
            } else if (axis === 'y') {
                ab.lUpper.rotation.y = (ab.lUpper_init ? ab.lUpper_init.y : 0) + v;
                ab.rUpper.rotation.y = (ab.rUpper_init ? ab.rUpper_init.y : 0) + v;
            } else {
                ab.lUpper.rotation.z = (ab.lUpper_init ? ab.lUpper_init.z : 0) + v;
                ab.rUpper.rotation.z = (ab.rUpper_init ? ab.rUpper_init.z : 0) - v;
            }
            ab.lUpper.updateMatrixWorld(true);
            ab.rUpper.updateMatrixWorld(true);
            return 'ok ' + axis + '=' + v.toFixed(3);
        } catch (e) {
            return 'ERR:' + e.message;
        }
    },
    getArmWorld: function() {
        // è°è¯ç¨ï¼è¿åæèéª¨éª¼çä¸çåæ ï¼ç²¾ç¡®å¤æ­æè½¬æ¹åï¼
        try {
            const ab = state.armBones;
            if (!ab || !ab.lUpper) return 'no-arm';
            function wpos(b) {
                if (!b) return null;
                const v = new THREE.Vector3();
                b.getWorldPosition(v);
                return { x: +v.x.toFixed(2), y: +v.y.toFixed(2), z: +v.z.toFixed(2) };
            }
            return JSON.stringify({
                lUpper: wpos(ab.lUpper), lElbow: wpos(ab.lElbow), lHand: wpos(ab.lHand),
                rUpper: wpos(ab.rUpper), rElbow: wpos(ab.rElbow), rHand: wpos(ab.rHand),
            });
        } catch (e) {
            return 'ERR:' + e.message;
        }
    },
};
