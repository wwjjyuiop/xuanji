<!DOCTYPE html>
<html><head><meta charset="UTF-8"></head>
<body>
<div id="log">wait</div>
<script src="lib/ammo.wasm.js"></script>
<script type="importmap">
{ "imports": {
  "three": "./lib/three.module.min.js",
  "three/addons/loaders/MMDLoader.js": "./lib/MMDLoader.js",
  "three/addons/animation/MMDAnimationHelper.js": "./lib/MMDAnimationHelper.js"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { MMDLoader } from 'three/addons/loaders/MMDLoader.js';
import { MMDAnimationHelper } from 'three/addons/animation/MMDAnimationHelper.js';
var Lel=document.getElementById('log');
function L(s){ Lel.textContent+=s+"\n"; }
window.__t = { last:-1, moved:false };
var scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(45,400/500,1,2000);
camera.position.set(0,8,30);
var renderer=new THREE.WebGLRenderer({canvas:document.createElement('canvas'),alpha:true});
renderer.setSize(400,500); document.body.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff,0.7));
var loader=new MMDLoader(), mesh=null, helper=null, mixer=null;
function buildHelper(){ try{ helper=new MMDAnimationHelper({audio:false,physics:false}); if(helper.enabled){helper.enabled.ik=false;helper.enabled.grant=false;} L('helper OK IK关'); }catch(e){L('helper失败 '+e.message);} }
function initAmmo(){ if(typeof Ammo!=='undefined'&&typeof Ammo.btVector3!=='undefined'){L('Ammo就绪');buildHelper();return;} setTimeout(initAmmo,300); } setTimeout(initAmmo,300);
L('load model...');
loader.load('models/琳奈.pmx',function(m){
  mesh=m; scene.add(mesh); L('模型 '+m.skeleton.bones.length+'骨骼');
  if(helper){try{helper.add(m,{physics:false});L('helper.add mesh ok');}catch(e){L('add err '+e.message);}}
  setTimeout(function(){
    L('--触发 wave--');
    loader.loadAnimation('actions/wavefile_v2.vmd', m, function(anim){
      L('wave加载成功, 播放');
      try{
        if(m.animationMixer){ mixer=m.animationMixer; mixer.clipAction(anim).play(); L('mixer播放 初始t='+mixer.time.toFixed(2)); }
        else if(helper){ helper.add(m,{animation:anim,physics:false}); L('helper.add 播放'); }
      }catch(e){ L('播放异常 '+e.message); }
      // 记录 3 次 mixer 时间, 判断是否走动
      setTimeout(function(){ L('CHECK1 t='+(mixer?mixer.time.toFixed(2):'no-mixer')); }, 3000);
      setTimeout(function(){ L('CHECK2 t='+(mixer?mixer.time.toFixed(2):'no-mixer')+' (两值不同=动画在走)'); }, 6000);
      setTimeout(function(){ L('CHECK3 t='+(mixer?mixer.time.toFixed(2):'no-mixer')); }, 9000);
    },function(x){if(x.loaded)L('wave '+Math.round(x.loaded/x.total*100)+'%');},
      function(e){L('wave失败 '+e.message);});
  },1500);
},function(){},function(e){L('模型失败 '+e.message);});
function animate(){ requestAnimationFrame(animate); try{ if(mixer) mixer.update(0.016); }catch(e){} renderer.render(scene,camera); }
animate();
</script>
</body></html>
